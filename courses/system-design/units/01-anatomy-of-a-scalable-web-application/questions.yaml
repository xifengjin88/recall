- key: sd01-q001
  type: single
  section: "1.2"
  difficulty: 1
  prompt: Where do interviewers usually want you to **start** a system design?
  options:
    - Small, with one machine, then scale from there
    - With the full multi-datacenter design up front
    - With the database schema
    - With the choice of cloud provider
  answer: Small, with one machine, then scale from there
  explanation: Start with one machine, then scale by **separating out each component** of that single machine onto its own machines.

- key: sd01-q002
  type: order
  section: "1.3"
  difficulty: 2
  prompt: Put the **main request path** of the scalable web backend in order.
  items:
    - Client on the Internet
    - Load balancer
    - App server
    - Memcached, then the distributed database on a miss
  explanation: A REST API request goes Internet → load balancer → one of N app servers, which checks the cache first and reads the database on a miss. The response goes back the same way.

- key: sd01-q003
  type: match
  section: "1.3"
  difficulty: 1
  prompt: Match each component of the diagram to its job.
  pairs:
    - { term: CDN, definition: Serves static content such as images and videos close to users }
    - { term: Load balancer, definition: Sends each request to any one of the app servers }
    - { term: Memcached, definition: Holds a subset of the DB data in memory }
    - { term: Job queue, definition: Holds offline jobs so they run asynchronously }
    - { term: Data processing system, definition: "Reads data from the DB and writes metrics back (Hadoop, Spark)" }
  explanation: These are the flows to memorize; the same diagram is reused later for Uber/Lyft, e-commerce, social networks and messaging.

- key: sd01-q004
  type: single
  section: "1.4"
  difficulty: 1
  prompt: Why is the CDN drawn apart from the rest of the backend?
  options:
    - It's run by a third party and sits close to users, not in your backend
    - It only handles write requests
    - It must sit behind the load balancer
    - It replaces the database for images
  answer: It's run by a third party and sits close to users, not in your backend
  explanation: CDNs (e.g. **Akamai**) are 3rd-party servers located around the world that serve cached static content for quicker access in different locations.

- key: sd01-q005
  type: typed
  section: "1.4"
  difficulty: 1
  prompt: Name the example CDN company from the course.
  accept: [Akamai]
  explanation: Akamai. Cloudflare and CloudFront are other well-known CDNs.

- key: sd01-q006
  type: multi
  section: "1.4"
  difficulty: 2
  prompt: When there are several load balancer machines, how can clients be spread across them?
  options:
    - Assign each client one randomly
    - Use DNS
    - Always send everyone to the first one
    - Let the database choose
  answers:
    - Assign each client one randomly
    - Use DNS
  explanation: A client can be assigned a random LB machine (if it's overloaded it can be reassigned, but usually it's better to add machines and keep assignment random). DNS can also spread load across LBs.

- key: sd01-q007
  type: truefalse
  section: "1.4"
  difficulty: 1
  prompt: In this design the app servers are **stateful**.
  answer: false
  explanation: They're **stateless** and all run the same version of the app, so any request can be handled by whichever server gets it. Adding servers raises throughput.

- key: sd01-q008
  type: single
  section: "1.4"
  difficulty: 1
  prompt: What does adding more app servers increase?
  options:
    - Throughput
    - Consistency
    - Cache hit rate
    - Disk capacity
  answer: Throughput
  explanation: Throughput is the number of requests the system can process; stateless servers let you add them freely.

- key: sd01-q009
  type: single
  section: "1.4"
  difficulty: 2
  prompt: On a cache miss, who reads the database?
  options:
    - The app server
    - The cache server
    - The load balancer
    - A worker
  answer: The app server
  explanation: The web application handles misses. A cache that queried the DB itself would need its own code, monitoring and DB access and would be tied to one database; at that point it's an app server, not a cache.

- key: sd01-q010
  type: truefalse
  section: "1.4"
  difficulty: 1
  prompt: In an interview you should defend choosing Memcached over Redis.
  answer: false
  explanation: Either works. Memcached was picked only because it's universally known; just say **"in-memory cache"**.

- key: sd01-q011
  type: single
  section: "1.4"
  difficulty: 1
  prompt: What does drawing **several DB boxes** in the distributed database imply?
  options:
    - Sharding
    - A single primary with no replicas
    - An in-memory database
    - A CDN in front of the DB
  answer: Sharding
  explanation: The distributed database can be MySQL, NoSQL or an object store; multiple boxes means the data is split across machines.

- key: sd01-q012
  type: multi
  section: "1.4"
  difficulty: 2
  prompt: Which are true of the job queue in a large system?
  options:
    - It runs on its own machines, often a separate cluster
    - It keeps replicas so a machine failure doesn't lose jobs
    - It lives in app-server memory
    - Kafka and RabbitMQ are examples
  answers:
    - It runs on its own machines, often a separate cluster
    - It keeps replicas so a machine failure doesn't lose jobs
    - Kafka and RabbitMQ are examples
  explanation: The queue is its own (distributed) system with built-in redundancy. Queue + workers can follow a publish-subscribe model.

- key: sd01-q013
  type: single
  section: "1.4"
  difficulty: 2
  prompt: A worker keeps failing on a job. What does the course recommend?
  options:
    - Retry; if it still fails, write to a per-user error table the app server returns to the user
    - Drop the job silently
    - Restart the whole queue cluster
    - Move the job into Memcached
  answer: Retry; if it still fails, write to a per-user error table the app server returns to the user
  explanation: The app server checks the error table and returns the error to the user along with a mitigation action.

- key: sd01-q014
  type: single
  section: "1.4"
  difficulty: 2
  prompt: What software do workers typically run?
  options:
    - A client provided by the queue system, e.g. Kafka's `KafkaConsumer`
    - The CDN's edge software
    - The database's storage engine
    - The load balancer's health checker
  answer: A client provided by the queue system, e.g. Kafka's `KafkaConsumer`
  explanation: Think of workers as another fleet of app servers dedicated to async tasks. They consume tasks and write job output to the DB.

- key: sd01-q015
  type: truefalse
  section: "1.4"
  difficulty: 1
  prompt: Kafka vs RabbitMQ is a common interview question for generalists.
  answer: false
  explanation: It's product-specific knowledge that interviews don't usually ask about unless you specialize in those systems.

- key: sd01-q016
  type: single
  section: "1.5"
  difficulty: 1
  prompt: What is a **distributed system**?
  options:
    - A system split across machines that coordinate to work as one system
    - Any system with more than one user
    - A system that uses microservices
    - A system deployed to more than one cloud region
  answer: A system split across machines that coordinate to work as one system
  explanation: Examples include a distributed file system, a distributed cache, or a group of web servers serving requests.

- key: sd01-q017
  type: match
  section: "1.5"
  difficulty: 2
  prompt: Match each concept to the level it lives at.
  pairs:
    - { term: Microservices vs monolith, definition: "Software architecture: how the logic is grouped" }
    - { term: Single vs multiple servers, definition: "Infrastructure design: how many machines" }
    - { term: REST, definition: "An architecture style for APIs, not a component" }
  explanation: Once you've decided on X servers you can split the logic into smaller services if needed; the two decisions are separate.

- key: sd01-q018
  type: single
  section: "1.5"
  difficulty: 3
  prompt: "`addFriend` goes through the job queue, and the queue lags. For a sensitive action like this, what's the better choice?"
  options:
    - Acknowledge only after the relationship is actually updated in the DB
    - Acknowledge immediately and hope the queue catches up
    - Skip the database and store friendships only in Memcached
    - Make the load balancer retry the request
  answer: Acknowledge only after the relationship is actually updated in the DB
  explanation: A trick is to write to the cache, enqueue, and acknowledge so an immediate read hits the cache (retrying and then erroring if the DB update fails), but for a sensitive action returning after the DB update is safer.

- key: sd01-q019
  type: order
  section: "1.3"
  difficulty: 2
  prompt: Put the **async work** flow in order.
  items:
    - App server creates an offline job
    - Job queue
    - Worker processes the job
    - Job output written to the database
  explanation: Queues decouple slow work from the request path; workers consume from the queue and write results to the DB.

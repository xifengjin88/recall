[project]
name = "recall-server"
version = "0.1.0"
description = "Recall server: SM-2 engine, course content and the Flask API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "coverage>=7.6",
  "pip-audit>=2.7",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_engine", "src/recall_content", "src/recall_api"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# The formatter owns line width; long string literals (messages, expectations) stay on one line.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["src/recall_engine"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src"]
